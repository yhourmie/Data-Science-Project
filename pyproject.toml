[project]
name = "dsp"
version = "0.1.0"
description = "End-to-end data science portfolio: tabular ML, deep-learning forecasting and computer vision"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "mlflow>=3.0",
]

[project.optional-dependencies]
bank = ["xgboost>=2.1", "skops>=0.10"]
energy = ["torch>=2.4", "lightgbm>=4.5"]
vision = ["torch>=2.4", "torchvision>=0.19", "pillow>=10.4"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "joblib>=1.4"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.8", "dvc>=3.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
