seed: 42

bank:
  data_url: https://archive.ics.uci.edu/static/public/222/bank+marketing.zip
  test_size: 0.2
  cv_folds: 5
  # `duration` is only known after the call ends, so it leaks the outcome. It is dropped.
  drop_columns: [duration]
  # Illustrative campaign economics used to pick the decision threshold
  cost_per_call: 5.0
  revenue_per_subscription: 50.0
  models:
    logreg:
      C: 1.0
    random_forest:
      n_estimators: 400
      min_samples_leaf: 5
    xgboost:
      n_estimators: 500
      learning_rate: 0.05
      max_depth: 4
      subsample: 0.8
      colsample_bytree: 0.8

ev:
  # Washington State DOL registrations (catalog.data.gov "Electric Vehicle Population Data")
  data_url: https://data.wa.gov/api/views/f6w7-q2d2/rows.csv?accessType=DOWNLOAD
  test_size: 0.2
  cv_folds: 5
  # One-hot levels seen fewer times than this are pooled (linear baseline only)
  min_category_count: 20
  models:
    logreg:
      C: 1.0
    hist_gb:
      max_iter: 300
      learning_rate: 0.05
      max_leaf_nodes: 63
      l2_regularization: 1.0
    xgboost:
      n_estimators: 400
      learning_rate: 0.05
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
